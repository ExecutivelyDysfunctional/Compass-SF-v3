<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Golden Gate bridge with north star">
  <defs>
    <linearGradient id="gg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2438"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="gg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc350"/>
      <stop offset="1" stop-color="#e08a00"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#gg-bg)"/>

  <!-- north star -->
  <path d="M256 78c7 42 18 53 60 60-42 7-53 18-60 60-7-42-18-53-60-60 42-7 53-18 60-60Z" fill="#ffd27a"/>

  <!-- suspension cables -->
  <path d="M70 330 L166 186 Q256 300 346 186 L442 330"
        fill="none" stroke="url(#gg-gold)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- towers -->
  <g fill="url(#gg-gold)">
    <rect x="152" y="176" width="17" height="182" rx="6"/>
    <rect x="184" y="176" width="17" height="182" rx="6"/>
    <rect x="150" y="216" width="53" height="14" rx="6"/>
    <rect x="150" y="280" width="53" height="14" rx="6"/>
    <rect x="311" y="176" width="17" height="182" rx="6"/>
    <rect x="343" y="176" width="17" height="182" rx="6"/>
    <rect x="309" y="216" width="53" height="14" rx="6"/>
    <rect x="309" y="280" width="53" height="14" rx="6"/>
  </g>

  <!-- deck -->
  <rect x="62" y="330" width="388" height="19" rx="9" fill="#ffb020"/>

  <!-- fog bands -->
  <g fill="#3a4761" opacity="0.85">
    <rect x="96" y="382" width="200" height="15" rx="7"/>
    <rect x="316" y="382" width="100" height="15" rx="7"/>
    <rect x="146" y="418" width="220" height="15" rx="7" opacity="0.6"/>
  </g>
</svg>
