<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Compass rose">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2438"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="cr-gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e08a00"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#cr-bg)"/>

  <!-- thin containing ring, no tick marks (they read as a gun sight when small) -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#26324a" stroke-width="9"/>

  <!-- south / east / west spikes: wide enough to hold up at 16px -->
  <polygon points="256,428 208,304 256,256" fill="#3a4761"/>
  <polygon points="256,428 304,304 256,256" fill="#4a5878"/>
  <polygon points="84,256 208,208 256,256" fill="#4a5878"/>
  <polygon points="84,256 208,304 256,256" fill="#3a4761"/>
  <polygon points="428,256 304,208 256,256" fill="#3a4761"/>
  <polygon points="428,256 304,304 256,256" fill="#4a5878"/>

  <!-- north spike in beacon gold -->
  <polygon points="256,84 208,208 256,256" fill="#e08a00"/>
  <polygon points="256,84 304,208 256,256" fill="#ffd27a"/>

  <circle cx="256" cy="256" r="31" fill="#0a0f1a" stroke="url(#cr-gold)" stroke-width="14"/>
</svg>
