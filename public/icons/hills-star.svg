<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="North star over San Francisco hills">
  <defs>
    <linearGradient id="hs-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2b46"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <radialGradient id="hs-glow" cx="0.5" cy="0.42" r="0.44">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hs-star" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe9bd"/>
      <stop offset="1" stop-color="#e39100"/>
    </linearGradient>
    <clipPath id="hs-clip">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#hs-bg)"/>

  <g clip-path="url(#hs-clip)">
    <circle cx="256" cy="214" r="196" fill="url(#hs-glow)"/>

    <circle cx="116" cy="122" r="8" fill="#e6ecf7" opacity="0.75"/>
    <circle cx="396" cy="104" r="7" fill="#e6ecf7" opacity="0.55"/>
    <circle cx="410" cy="196" r="6" fill="#e6ecf7" opacity="0.45"/>
    <circle cx="102" cy="222" r="6" fill="#e6ecf7" opacity="0.4"/>

    <!-- north star -->
    <path d="M256 84c11 66 28 83 94 94-66 11-83 28-94 94-11-66-28-83-94-94 66-11 83-28 94-94Z" fill="url(#hs-star)"/>

    <!-- hills, lightened so they survive at small sizes -->
    <path d="M-20 392c74-70 140-70 208 0 66-66 128-68 200-10 42 34 88 46 174 36v106H-20Z" fill="#46557a"/>
    <path d="M-20 446c90-60 158-56 226 4 60-52 124-58 200-18 46 24 94 30 154 22v92H-20Z" fill="#26324a"/>
  </g>
</svg>
