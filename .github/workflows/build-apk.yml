name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    # Trigger when the commit message contains [Build-apk] (case-tolerant) or when manually triggered
    if: >
      contains(github.event.head_commit.message, '[Build-apk]') ||
      contains(github.event.head_commit.message, '[build-apk]') ||
      contains(github.event.head_commit.message, '[BUILD-APK]') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64"
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compass-SF-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
